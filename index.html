<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pleshanov Publisher</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --text: #151922;
      --muted: #5b6472;
      --line: #d9dde7;
      --accent: #0d6efd;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 32px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 7vw, 48px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    p { margin: 0 0 20px; color: var(--muted); }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Pleshanov Publisher</h1>
      <p>Pleshanov Publisher helps manage and publish short-form social media content from one place.</p>
      <p>This site hosts the legal pages required for platform integrations.</p>
      <nav aria-label="Legal pages">
        <a class="button" href="privacy.html">Privacy Policy</a>
        <a class="button" href="terms.html">Terms of Service</a>
      </nav>
    </section>
    <footer>Contact: gamgid@users.noreply.github.com</footer>
  </main>
</body>
</html>
